[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "event-driven-trading-bot"
version = "0.1.0"
description = "Configurable event-driven algorithmic trading bot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6",
    "numba==0.61.2",
    "orjson==3.10.18",
    "PyYAML==6.0.2",
    "python-dotenv==1.1.0",
    "tzdata==2025.2; platform_system == 'Windows'",
    "uvloop==0.21.0; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "hypothesis==6.130.2",
    "pytest-cov==6.1.1",
    "mypy==1.15.0",
    "types-PyYAML==6.0.12.20250516",
    "ruff==0.11.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "DTZ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/trading_bot", "tests"]